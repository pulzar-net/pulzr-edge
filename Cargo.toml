[workspace]
resolver = "2"
members = ["crates/pulzr-protocol", "crates/pulzr-edge"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/pulzar-net/pulzr-edge"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
