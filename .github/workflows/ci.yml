name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      # Installs rustup too where the runner has none (the self-hosted one).
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Bumble, the virtual Bluetooth controller for the ble tests
        run: python -m pip install -r crates/pulzr-edge/tests/bumble/requirements.txt
      - name: Tests, with the Bumble ble tests required
        env:
          BUMBLE_PYTHON: python
          BUMBLE_REQUIRED: "1"
        run: cargo test --workspace
