# Static musl binaries for the gateways, on a tag.
#
#   aarch64-unknown-linux-musl   Pi 3, 4 and 5 (PulzarOS aarch64_cortex-a53/a72/a76)
#   mipsel-unknown-linux-musl    RAK7268/7289, GL-SFT1200 (PulzarOS mipsel_24kc)
#   mips-unknown-linux-musl      Dragino LPS8N (PulzarOS mips_24kc)
#
# PulzarOS stages them like ChirpStack's: its feed/pulzr-edge/fetch downloads
# one by name from this release and checks it against SHA256SUMS.
#
# mipsel and mips are tier 3 targets: no prebuilt std, so it builds std itself on a
# pinned nightly (-Zbuild-std), and links against zig's musl because Rust ships
# no self-contained C runtime for it. ring compiles its portable C there; it
# has no MIPS assembly, which costs speed, not correctness.
#
# pulzr-edge-sim, a Modbus TCP device simulator for testing without hardware,
# and pulzr-probe, which names the radios plugged into a gateway and ships in
# every image (so it is held to 500 KB), are built and checked the same way and
# published beside the daemon.
#
# Every target's whole test suite runs under qemu-user before anything is
# published, so a binary that cannot run (atomics, endianness, a syscall)
# fails here and not on a gateway.

name: release
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  NIGHTLY: nightly-2026-11-14
  ZIG: 0.16.0
  ZIGBUILD: 0.24.1

jobs:
  build:
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: The tag is the crate version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          want="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)"
          [ "${GITHUB_REF_NAME#v}" = "${want}" ] || { echo "tag ${GITHUB_REF_NAME} is not v${want}" >&2; exit 1; }

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.NIGHTLY }}
          components: rust-src
          targets: aarch64-unknown-linux-musl
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG }}
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild@${{ env.ZIGBUILD }}
      - name: qemu-user
        run: sudo apt-get update -q && sudo apt-get install -y -q qemu-user

      - name: Test and build
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_RUNNER: qemu-aarch64
          CARGO_TARGET_MIPSEL_UNKNOWN_LINUX_MUSL_RUNNER: qemu-mipsel
          CARGO_TARGET_MIPSEL_UNKNOWN_LINUX_MUSL_RUSTFLAGS: -C target-feature=+crt-static -C link-self-contained=no
          CARGO_TARGET_MIPS_UNKNOWN_LINUX_MUSL_RUNNER: qemu-mips
          CARGO_TARGET_MIPS_UNKNOWN_LINUX_MUSL_RUSTFLAGS: -C target-feature=+crt-static -C link-self-contained=no
        run: |
          set -euo pipefail
          mkdir -p dist
          for target in aarch64-unknown-linux-musl mipsel-unknown-linux-musl mips-unknown-linux-musl; do
            std=()
            case "${target}" in mips*) std=(-Zbuild-std) ;; esac
            cargo-zigbuild test --workspace --all-features --target "${target}" "${std[@]}"
            case "${target}" in mips*) std=(-Zbuild-std=std,panic_abort) ;; esac
            # One binary per module, each the pulzr-edge bin built with only its
            # module's feature, so a gateway carries only what it runs (PulzrOS
            # ships each in its capability's add-on). <dist name> <package>
            # <bin> <features>. Bluetooth is little-endian only (bt-hci).
            builds="pulzr-edge pulzr-edge pulzr-edge modbus
          pulzr-edge-zigbee pulzr-edge pulzr-edge zigbee
          pulzr-edge-zwave pulzr-edge pulzr-edge zwave
          pulzr-edge-matter pulzr-edge pulzr-edge matter
          pulzr-edge-ble pulzr-edge pulzr-edge ble
          pulzr-edge-ip pulzr-edge pulzr-edge ip
          pulzr-edge-sim pulzr-edge pulzr-edge-sim sim
          pulzr-probe pulzr-probe pulzr-probe -"
            while read -r name pkg bin_name features; do
              case "${name}:${target}" in pulzr-edge-ble:mips-*) continue ;; esac
              feat=()
              [ "${features}" = - ] || feat=(--no-default-features --features "${features}")
              cargo zigbuild --release -p "${pkg}" --bin "${bin_name}" "${feat[@]}" --target "${target}" "${std[@]}"
              bin="target/${target}/release/${bin_name}"
              file "${bin}" | grep -q 'statically linked' || { file "${bin}"; echo "${target}: ${name} not static" >&2; exit 1; }
              # Flash is squashfs (xz), an add-on's overlay takes the raw size:
              # both are said, because they decide which boards can take an
              # add-on. pulzr-probe is in every image: 500 KB on flash at most;
              # most of its raw size is std's backtrace support and musl, which
              # stable Rust cannot leave out.
              raw="$(stat -c %s "${bin}")"
              flash="$(xz -9e -c "${bin}" | wc -c)"
              echo "${target}: ${name} ${raw} bytes, ${flash} on flash"
              if [ "${name}" = pulzr-probe ]; then
                [ "${flash}" -le 512000 ] || { echo "${target}: pulzr-probe is ${flash} bytes on flash, over 500 KB" >&2; exit 1; }
              fi
              runner="CARGO_TARGET_$(echo "${target}" | tr 'a-z-' 'A-Z_')_RUNNER"
              "${!runner}" "${bin}" --version
              # Copied out at once: the next build of the same bin replaces it.
              cp "${bin}" "dist/${name}-${target%%-*}-linux-musl"
            done <<<"${builds}"
          done
          (cd dist && sha256sum pulzr-* > SHA256SUMS && cat SHA256SUMS)

      - name: Release notes from the tag
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          # The annotated tag's message (git tag -a vX.Y.Z --cleanup=whitespace
          # -F notes.md), else GitHub's generated notes; never none.
          set -euo pipefail
          notes="${RUNNER_TEMP}/notes.md"
          git fetch -q --force origin "refs/tags/${TAG}:refs/tags/${TAG}"
          : > "${notes}"
          if [ "$(git cat-file -t "refs/tags/${TAG}")" = tag ]; then
            git cat-file tag "refs/tags/${TAG}" | sed '1,/^$/d; /^-----BEGIN [A-Z ]*SIGNATURE-----$/,$d' > "${notes}"
          fi
          if ! awk -v t="${TAG}" 'NF && $0 != t { f = 1 } END { exit !f }' "${notes}"; then
            gh api "repos/${GITHUB_REPOSITORY}/releases/generate-notes" -f tag_name="${TAG}" -q .body > "${notes}"
            awk 'NF && !/Full Changelog/ { f = 1 } END { exit !f }' "${notes}" || {
              echo "::error::${TAG} has no release notes: tag it with git tag -a and the notes as its message"; exit 1; }
          fi
      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --title "${GITHUB_REF_NAME}" --notes-file "${RUNNER_TEMP}/notes.md"
