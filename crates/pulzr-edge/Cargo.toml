[package]
name = "pulzr-edge"
description = "Pulzr edge daemon: speaks the Pulzar protocol for the devices behind a PulzarOS gateway (Modbus RTU and TCP first)"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["zigbee", "zwave", "matter"]
# The Modbus TCP device simulator (`pulzr-edge-sim`, the `sim` module).
sim = ["tokio-modbus/tcp-server"]
# Zigbee coordinators as a radio module (`pulzr-edge radio serve`), on
# zigbee-bridge's stack: EmberZNet, Z-Stack and deCONZ dongles.
zigbee = ["dep:sha2", "dep:zigbee-host", "dep:zigbee-bridge", "dep:zigbee-zcl", "dep:zigbee-zdo", "dep:zigbee-types"]
# Z-Wave Serial API controllers as a radio module (`pulzr-edge radio serve`),
# on zwave-bridge's host stack.
zwave = ["dep:zwave-host", "dep:zwave-security", "dep:zwave-serial", "dep:sha2", "tokio/process"]
# The gateway's controller in its organization's Matter fabric, as the radio
# `matter`, on matter-bridge's controller.
matter = ["dep:matter-controller", "dep:matter-model"]

[[bin]]
name = "pulzr-edge"
path = "src/main.rs"

[[bin]]
name = "pulzr-edge-sim"
path = "src/bin/pulzr-edge-sim.rs"
required-features = ["sim"]

[[test]]
name = "sim"
required-features = ["sim"]

[dependencies]
pulzr-protocol = { path = "../pulzr-protocol" }
anyhow = "1"
rumqttc = { version = "0.25", default-features = false, features = ["use-rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
schemars = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "sync", "time", "fs", "net", "io-util", "process"] }
tokio-modbus = { version = "0.17", default-features = false, features = ["tcp", "rtu"] }
tokio-serial = "5"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
zigbee-host = { git = "https://github.com/pulzar-net/zigbee-bridge", rev = "b21cb90d92b6195519a60b71898d656d8c00a499", optional = true }
zigbee-bridge = { git = "https://github.com/pulzar-net/zigbee-bridge", rev = "b21cb90d92b6195519a60b71898d656d8c00a499", optional = true }
zigbee-zcl = { git = "https://github.com/pulzar-net/zigbee-bridge", rev = "b21cb90d92b6195519a60b71898d656d8c00a499", optional = true }
zigbee-zdo = { git = "https://github.com/pulzar-net/zigbee-bridge", rev = "b21cb90d92b6195519a60b71898d656d8c00a499", optional = true }
zigbee-types = { git = "https://github.com/pulzar-net/zigbee-bridge", rev = "b21cb90d92b6195519a60b71898d656d8c00a499", optional = true }
zwave-host = { git = "https://github.com/pulzar-net/zwave-bridge", rev = "01d33e02e0c51acb829952d05cc8dc7f0a50629b", optional = true }
zwave-security = { git = "https://github.com/pulzar-net/zwave-bridge", rev = "01d33e02e0c51acb829952d05cc8dc7f0a50629b", optional = true }
zwave-serial = { git = "https://github.com/pulzar-net/zwave-bridge", rev = "01d33e02e0c51acb829952d05cc8dc7f0a50629b", optional = true }
matter-controller = { git = "https://github.com/pulzar-net/matter-bridge", rev = "289246265195694e9559722f1067fb5f71bde680", default-features = false, optional = true }
matter-model = { git = "https://github.com/pulzar-net/matter-bridge", rev = "289246265195694e9559722f1067fb5f71bde680", optional = true }
base64 = "0.22"
# IP cameras (`pulzr-edge camera`): their settings API is plain HTTP on the LAN.
des = "0.9"
quick-xml = "0.42"
reqwest = { version = "0.13", default-features = false }
hex = "0.4"
sha2 = { version = "0.11", optional = true }

# Bluetooth (`pulzr-edge ble`). bt-hci, which encodes HCI, builds for
# little-endian machines only, so big-endian boards (mips) have no `ble`.
[target.'cfg(target_endian = "little")'.dependencies]
bluetooth-adv = { git = "https://github.com/pulzar-net/bluetooth-bridge", tag = "v0.1.0" }
bluetooth-host = { git = "https://github.com/pulzar-net/bluetooth-bridge", tag = "v0.1.0" }

[dev-dependencies]
sha2 = "0.11"
zwave-sim = { git = "https://github.com/pulzar-net/zwave-bridge", rev = "01d33e02e0c51acb829952d05cc8dc7f0a50629b" }
zigbee-sim = { git = "https://github.com/pulzar-net/zigbee-bridge", rev = "b21cb90d92b6195519a60b71898d656d8c00a499" }
zigbee-types = { git = "https://github.com/pulzar-net/zigbee-bridge", rev = "b21cb90d92b6195519a60b71898d656d8c00a499" }
zigbee-zcl = { git = "https://github.com/pulzar-net/zigbee-bridge", rev = "b21cb90d92b6195519a60b71898d656d8c00a499" }
tokio = { version = "1", features = ["process", "io-util", "rt-multi-thread", "macros", "time", "sync"] }
tokio-modbus = { version = "0.17", default-features = false, features = ["tcp", "rtu", "tcp-server"] }
tempfile = "3"
jsonschema = { version = "0.61", default-features = false }
