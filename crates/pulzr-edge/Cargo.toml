[package]
name = "pulzr-edge"
description = "Pulzr edge daemon: speaks the Pulzar protocol for the devices behind a PulzarOS gateway (Modbus RTU and TCP first)"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# Every module, for development and the tests. A gateway gets one binary per
# module instead, each built with only its own feature, so it carries only
# what it runs: pulzr-edge (Modbus), pulzr-edge-zigbee, pulzr-edge-zwave,
# pulzr-edge-matter, pulzr-edge-ble (release.yml and
# PulzrOS's sdk/packages/pulzr-edge). Every one keeps the radio control
# client, so any of them can talk to a running module.
default = ["modbus", "ble", "zigbee", "zwave", "matter"]
# Modbus RTU and TCP buses (`pulzr-edge <config>`).
modbus = ["dep:tokio-modbus", "dep:tokio-serial"]
# Bluetooth LE (`pulzr-edge ble`); little-endian machines only (bt-hci).
ble = ["dep:bluetooth-adv", "dep:bluetooth-host"]
# The Modbus TCP device simulator (`pulzr-edge-sim`, the `sim` module).
sim = ["modbus", "tokio-modbus/tcp-server"]
# Zigbee coordinators as a radio module (`pulzr-edge radio serve`), on
# zigbee-bridge's stack: EmberZNet, Z-Stack and deCONZ dongles.
zigbee = ["dep:sha2", "dep:zigbee-host", "dep:zigbee-bridge", "dep:zigbee-zcl", "dep:zigbee-zdo", "dep:zigbee-primitives"]
# Z-Wave Serial API controllers as a radio module (`pulzr-edge radio serve`),
# on zwave-bridge's host stack.
zwave = ["dep:zwave-host", "dep:zwave-security", "dep:zwave-serial", "dep:sha2", "tokio/process"]
# The gateway's controller in its organization's Matter fabric, as the radio
# `matter`, on matter-bridge's controller.
matter = ["dep:matter-controller", "dep:matter-model", "dep:reqwest"]

[[bin]]
name = "pulzr-edge"
path = "src/main.rs"

[[bin]]
name = "pulzr-edge-sim"
path = "src/bin/pulzr-edge-sim.rs"
required-features = ["sim"]

[[test]]
name = "sim"
required-features = ["sim"]

[[test]]
name = "modbus_tcp"
required-features = ["modbus"]

[[test]]
name = "schema"
required-features = ["modbus"]

[[test]]
name = "ble"
required-features = ["ble"]

[dependencies]
pulzr-protocol = { path = "../pulzr-protocol" }
anyhow = "1"
rumqttc = { version = "0.25", default-features = false, features = ["use-rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
schemars = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "sync", "time", "fs", "net", "io-util", "process"] }
tokio-modbus = { version = "0.17", default-features = false, features = ["tcp", "rtu"], optional = true }
tokio-serial = { version = "5", optional = true }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
zigbee-host = { version = "0.3", optional = true }
zigbee-bridge = { version = "0.3", optional = true }
zigbee-zcl = { version = "0.3", optional = true }
zigbee-zdo = { version = "0.3", optional = true }
zigbee-primitives = { version = "0.3", optional = true }
zwave-host = { version = "0.2.1", optional = true }
zwave-security = { version = "0.2.1", optional = true }
zwave-serial = { version = "0.2.1", optional = true }
matter-controller = { git = "https://github.com/pulzar-net/matter-bridge", rev = "289246265195694e9559722f1067fb5f71bde680", default-features = false, optional = true }
matter-model = { git = "https://github.com/pulzar-net/matter-bridge", rev = "289246265195694e9559722f1067fb5f71bde680", optional = true }
base64 = "0.22"
reqwest = { version = "0.13", default-features = false, optional = true }
hex = "0.4"
sha2 = { version = "0.11", optional = true }

# Bluetooth (`pulzr-edge ble`). bt-hci, which encodes HCI, builds for
# little-endian machines only, so big-endian boards (mips) have no `ble`.
[target.'cfg(target_endian = "little")'.dependencies]
bluetooth-adv = { version = "0.2", optional = true }
bluetooth-host = { version = "0.2", optional = true }

[dev-dependencies]
sha2 = "0.11"
zwave-sim = { version = "0.2.1" }
zigbee-sim = { version = "0.3" }
zigbee-primitives = { version = "0.3" }
zigbee-zcl = { version = "0.3" }
tokio = { version = "1", features = ["process", "io-util", "rt-multi-thread", "macros", "time", "sync"] }
tokio-modbus = { version = "0.17", default-features = false, features = ["tcp", "rtu", "tcp-server"] }
tempfile = "3"
jsonschema = { version = "0.61", default-features = false }
