[package]
name = "pulzr-probe"
description = "Names the radios plugged into a PulzarOS gateway from sysfs and a table of known adapters, and probes only what it can name"
version.workspace = true
edition.workspace = true
license.workspace = true

# Small on purpose: it ships in every PulzrOS image, under 500 KB on flash
# (xz, as squashfs stores it; the release gates on it). No argument parser, no
# regex engine. A protocol probe from a stack (zigbee-host, zwave-serial) comes
# in behind a feature; the Z-Wave one is the only async code, a current-thread
# runtime that lives for one probe.

[[bin]]
name = "pulzr-probe"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# termios for the Spinel probe's serial port (src/spinel.rs); no code of its own.
libc = "0.2"
# The Z-Wave controller probe: zwave-bridge's Serial API layer only, no host
# stack. It brings a current-thread tokio for the length of one probe.
zwave-serial = { git = "https://github.com/pulzar-net/zwave-bridge", tag = "v0.1.0", optional = true }
# The Zigbee coordinator probe (EZSP, ZNP, deCONZ): zigbee-bridge's clients only, no host.
zigbee-host = { git = "https://github.com/pulzar-net/zigbee-bridge", tag = "v0.2.0", default-features = false, features = ["probe", "serial"], optional = true }
# zigbee-host's probe is async; it runs on a current-thread runtime that lives
# for one probe (zwave-serial brings the same tokio).
tokio = { version = "1", default-features = false, features = ["rt"], optional = true }

[features]
default = ["zwave", "zigbee"]
zwave = ["dep:zwave-serial"]
zigbee = ["dep:zigbee-host", "dep:tokio"]

[dev-dependencies]
# An EmberZNet NCP to probe in tests (tests/zigbee.rs).
zigbee-sim = { git = "https://github.com/pulzar-net/zigbee-bridge", tag = "v0.2.0" }
tokio = { version = "1", features = ["rt-multi-thread", "net"] }
jsonschema = { version = "0.61", default-features = false }
tempfile = "3"
